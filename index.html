<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>menkt Random</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            color: #222;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding-top: 130px;
        }

        h1 {
            font-size: 38px;
            font-weight: 400;
            margin: 0 0 25px;
        }

        .subtitle {
            font-size: 30px;
            margin: 0 0 170px;
        }

        .result {
            font-size: 27px;
            margin-bottom: 45px;
        }

        #number {
            font-size: 32px;
        }

        .description {
            font-size: 24px;
            margin-bottom: 20px;
        }

        input {
            width: 100px;
            height: 45px;
            font-size: 22px;
            text-align: center;
            border: 1px solid #999;
            border-radius: 5px;
            display: block;
            margin: 0 auto 20px;
        }

        button {
            background: none;
            border: none;
            font-size: 23px;
            cursor: pointer;
            color: #222;
        }

        button:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>menkt Random</h1>

        <div class="subtitle">
            Генератор рандомных чисел
        </div>

        <div class="result">
            ваше число: <span id="number">7</span>
        </div>

        <div class="description">
            укажите числа от 0 до 100
        </div>

        <input
            type="number"
            id="maxNumber"
            value="53"
            min="0"
            max="100"
        >

        <button onclick="generateNumber()">
            сгенерировать
        </button>

    </div>

    <script>
        function generateNumber() {

            const max = Number(
                document.getElementById("maxNumber").value
            );

            if (max < 0 || max > 100 || isNaN(max)) {
                alert("Введите число от 0 до 100");
                return;
            }

            const randomNumber = Math.floor(
                Math.random() * (max + 1)
            );

            document.getElementById("number").textContent = randomNumber;
        }
    </script>

</body>
</html>
